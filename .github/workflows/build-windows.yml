name: Build Windows executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.15.0
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build single-file executable
        run: python -m PyInstaller --clean --noconfirm --onefile --console --name xxt main.py
      - uses: actions/upload-artifact@v4
        with:
          name: xxt-windows-x64
          path: dist/xxt.exe
          if-no-files-found: error
